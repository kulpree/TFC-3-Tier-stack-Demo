name: Terraform Stacks – Local 3-Tier App

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
  TF_CLOUD_ORGANIZATION: "kulpree-demo"
  STACK_NAME: "three-tier-stack"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ env.TF_API_TOKEN }}
      - run: terraform init
      - if: github.event_name == 'pull_request'
        run: terraform plan -input=false

  apply-dev:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/terraform-cloud-action/apply@v1
        with:
          token: ${{ env.TF_API_TOKEN }}
          organization: ${{ env.TF_CLOUD_ORGANIZATION }}
          stack: ${{ env.STACK_NAME }}
          deployment: dev
          auto_approve: true

  apply-staging:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Staging Stack Deployment
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          HCP_ORG: "kulpree-demo"                # <-- replace with your org
          STACK_NAME: "three-tier-stack"         # <-- replace with your Stack name
          DEPLOYMENT_NAME: "staging"             # must match the deployment block name
        run: |
          set -euo pipefail

          echo "🔍 Resolving Stack ID for '${STACK_NAME}'..."
          STACK_ID=$(curl -sS \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${HCP_ORG}/stacks?filter%5Bname%5D=${STACK_NAME}" \
            | jq -r '.data[0].id')

          if [[ -z "${STACK_ID}" || "${STACK_ID}" == "null" ]]; then
            echo "❌ Could not find Stack '${STACK_NAME}' in organization '${HCP_ORG}'."
            exit 1
          fi
          echo "✅ Stack ID: ${STACK_ID}"

          echo "🔍 Resolving deployment group ID for '${DEPLOYMENT_NAME}'..."
          DEPLOYMENT_GROUP_ID=$(curl -sS \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/stacks/${STACK_ID}/stack-deployments" \
            | jq -r --arg name "${DEPLOYMENT_NAME}" '.data[] | select(.attributes.name == $name) | .relationships["stack-deployment-group"].data.id')

          if [[ -z "${DEPLOYMENT_GROUP_ID}" || "${DEPLOYMENT_GROUP_ID}" == "null" ]]; then
            echo "❌ Could not find deployment group '${DEPLOYMENT_NAME}' for Stack '${STACK_NAME}'."
            exit 1
          fi
          echo "✅ Deployment group ID: ${DEPLOYMENT_GROUP_ID}"

          echo "🚀 Triggering rerun of deployment group '${DEPLOYMENT_NAME}'..."
          HTTP_STATUS=$(curl -sS -o /tmp/rerun-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TF_API_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/stack-deployment-groups/${DEPLOYMENT_GROUP_ID}/rerun")

          if [[ "${HTTP_STATUS}" != "202" && "${HTTP_STATUS}" != "200" ]]; then
            echo "❌ Failed to trigger rerun. HTTP status: ${HTTP_STATUS}"
            cat /tmp/rerun-response.json
            exit 1
          fi

          echo "✅ Deployment group rerun triggered successfully."
          cat /tmp/rerun-response.json | jq .